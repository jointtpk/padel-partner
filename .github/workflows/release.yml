name: Release to stores

# Builds a signed Android App Bundle and iOS IPA and uploads them to
# Google Play (internal track by default) and TestFlight.
# Setup guide: docs/DEPLOYMENT.md
on:
  push:
    tags: ['v*'] # e.g. git tag v1.0.0 && git push origin v1.0.0
  workflow_dispatch:
    inputs:
      platform:
        description: Which store(s) to release to
        type: choice
        options: [both, android, ios]
        default: both
      play_track:
        description: Google Play track
        type: choice
        options: [internal, alpha, beta, production]
        default: internal

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  FLUTTER_VERSION: '3.35.x'
  PACKAGE_NAME: pk.jointt.padelpartner

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      build_number: ${{ steps.num.outputs.build_number }}
    steps:
      # Store build numbers must always increase. BUILD_NUMBER_OFFSET (repo
      # variable) lets you jump past builds that were uploaded by hand.
      - id: num
        run: echo "build_number=$(( ${{ github.run_number }} + ${{ vars.BUILD_NUMBER_OFFSET || 0 }} ))" >> "$GITHUB_OUTPUT"

  android:
    needs: prepare
    if: inputs.platform != 'ios'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Set up upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::Missing secret $v (see docs/DEPLOYMENT.md)"; exit 1; }
          done
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties

      - name: Build app bundle
        run: flutter build appbundle --release --build-number="$BUILD_NUMBER"

      - uses: actions/upload-artifact@v4
        with:
          name: android-aab-${{ env.BUILD_NUMBER }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ inputs.play_track || vars.PLAY_TRACK || 'internal' }}
          # Must stay "draft" until the app's first release has been reviewed
          # and published; then set repo variable PLAY_RELEASE_STATUS=completed.
          status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}

  ios:
    needs: prepare
    if: inputs.platform != 'android'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4

      # App Store Connect only accepts builds made with a current Xcode/SDK.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Install signing certificate and provisioning profile
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          for v in IOS_DIST_CERT_P12_BASE64 IOS_DIST_CERT_PASSWORD IOS_PROVISIONING_PROFILE_BASE64; do
            [ -n "${!v}" ] || { echo "::error::Missing secret $v (see docs/DEPLOYMENT.md)"; exit 1; }
          done

          CERT_PATH="$RUNNER_TEMP/dist.p12"
          PROFILE_PATH="$RUNNER_TEMP/dist.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$IOS_DIST_CERT_P12_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$PROFILE_PATH" "$dir/$PROFILE_UUID.mobileprovision"
          done

          # Picked up by ios/Flutter/Release.xcconfig (Runner target only, so Pods are unaffected).
          cat > ios/Flutter/Signing.xcconfig <<EOF
          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM = $TEAM_ID
          PROVISIONING_PROFILE_SPECIFIER = $PROFILE_NAME
          CODE_SIGN_IDENTITY = Apple Distribution
          CODE_SIGN_IDENTITY[sdk=iphoneos*] = Apple Distribution
          EOF

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$PACKAGE_NAME</key><string>$PROFILE_NAME</string>
            </dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF

      - name: Build IPA
        run: |
          flutter build ipa --release --build-number="$BUILD_NUMBER" \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ env.BUILD_NUMBER }}
          path: build/ios/ipa/*.ipa
          retention-days: 30

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
        run: |
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            [ -n "${!v}" ] || { echo "::error::Missing App Store Connect API secret for $v (see docs/DEPLOYMENT.md)"; exit 1; }
          done
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$ASC_KEY_P8_BASE64" | base64 --decode -o ~/.appstoreconnect/private_keys/AuthKey_"$ASC_KEY_ID".p8
          IPA=$(find build/ios/ipa -name '*.ipa' | head -n 1)
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP"/dist.* ~/.appstoreconnect/private_keys/*.p8 ios/Flutter/Signing.xcconfig
